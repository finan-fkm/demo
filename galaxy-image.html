<style>
    /*==========================
  Google Font
==========================*/
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:'Poppins',sans-serif;
    overflow-x:hidden;
}

/*==========================
Hero
==========================*/

.hero{
    position:relative;
    min-height:100vh;
    background:url("656670.jpg") center center/cover no-repeat;
    display:flex;
    align-items:center;
}

.overlay{
    position:absolute;
    inset:0;
    background:rgba(0,25,60,.72);
}

.hero .container{
    position:relative;
    z-index:2;
}

.hero-small{
    color:#1f8cff;
    font-size:18px;
    font-weight:600;
    letter-spacing:3px;
    display:inline-block;
    border-bottom:2px solid #1f8cff;
    padding-bottom:8px;
    margin-bottom:30px;
}

.hero h1{
    color:#fff;
    font-size:78px;
    font-weight:800;
    line-height:1.1;
}

.hero h1 span{
    color:#0d6efd;
}

.hero p{
    color:#d7d7d7;
    font-size:24px;
    line-height:1.8;
    margin:35px 0;
    max-width:760px;
}

.hero-buttons{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
}

.hero-buttons .btn{
    padding:16px 36px;
    border-radius:6px;
    font-size:18px;
    font-weight:600;
}

.btn-primary{
    background:#0d6efd;
    border:none;
}

.btn-primary:hover{
    background:#0b5ed7;
}

.btn-outline-light:hover{
    color:#000;
}

/*==========================
Scroll
==========================*/

.scroll-text{
    position:absolute;
    left:50%;
    bottom:25px;
    transform:translateX(-50%);
    color:#fff;
    text-align:center;
    letter-spacing:3px;
    font-size:14px;
    z-index:5;
}

.scroll-text .line{
    width:2px;
    height:55px;
    background:#fff;
    margin:12px auto 0;
    animation:scrollLine 1.8s infinite;
}

@keyframes scrollLine{

0%{
height:15px;
opacity:.3;
}

50%{
height:55px;
opacity:1;
}

100%{
height:15px;
opacity:.3;
}

}

/*==========================
About
==========================*/

#about{
    padding:100px 0;
}

#about h2{
    font-size:42px;
    font-weight:700;
    margin-bottom:20px;
}

#about p{
    color:#666;
    font-size:18px;
    line-height:1.9;
}

/*==========================
Gallery
==========================*/

.gallery-section{
    padding:90px 0;
    background:#f7f9fc;
}

.gallery-section .section-title{
    font-size:42px;
    font-weight:700;
    color:#0f172a;
    margin-bottom:12px;
}

.gallery-section .section-text{
    color:#64748b;
    max-width:700px;
    margin:0 auto 40px;
}

.gallery-card{
    background:#fff;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(15,23,42,.08);
    transition:transform .3s ease, box-shadow .3s ease;
    height:100%;
}

.gallery-card:hover{
    transform:translateY(-5px);
    box-shadow:0 18px 40px rgba(15,23,42,.12);
}

.gallery-card img{
    width:100%;
    height:260px;
    object-fit:cover;
}

.gallery-card-body{
    padding:18px;
}

.gallery-card-body h5{
    font-size:18px;
    font-weight:600;
    color:#0f172a;
    margin-bottom:8px;
}

.gallery-card-body p{
    color:#64748b;
    font-size:14px;
    margin:0;
}



/*==========================
Tablet
==========================*/

@media(max-width:992px){

.hero{
text-align:center;
}

.hero h1{
font-size:55px;
}

.hero p{
font-size:20px;
}

.hero-buttons{
justify-content:center;
}

.scroll-text{
display:none;
}

}

/*==========================
Mobile
==========================*/

@media(max-width:768px){

.navbar-brand img{
height:45px;
}

.hero{
padding-top:100px;
}

.hero-small{
font-size:14px;
}

.hero h1{
font-size:42px;
}

.hero p{
font-size:18px;
line-height:1.7;
}

.hero-buttons .btn{
width:100%;
}

#about h2{
font-size:32px;
}



}

/*==========================
Small Mobile
==========================*/

@media(max-width:480px){

.hero h1{
font-size:34px;
}

.hero p{
font-size:16px;
}

.hero-small{
letter-spacing:2px;
font-size:13px;
}

}
 .banner{
      width: 100%;
      height: 100%;
      background-image: url(656670.jpg);
      background-size:cover ;
    }
</style>
</head>
