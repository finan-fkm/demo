<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Keysons Group</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <style>
        /*==========================
  Google Font
==========================*/
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
        }

        /*==========================
 Products Section
==========================*/

        /*==========================
About
==========================*/

        #about {
            padding: 100px 0;
        }

        #about h2 {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        #about p {
            color: #666;
            font-size: 18px;
            line-height: 1.9;
        }

        /*==========================
WhatsApp
==========================*/

        .whatsapp {
            position: fixed;
            right: 25px;
            bottom: 25px;
            width: 65px;
            height: 65px;
            background: #25D366;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            text-decoration: none;
            font-size: 34px;
            z-index: 999;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .3);
            transition: .3s;
        }

        .whatsapp:hover {
            transform: scale(1.08);
            color: #fff;
        }

        /*==========================
Tablet
==========================*/

        @media(max-width:992px) {

            .hero {
                text-align: center;
            }

            .hero h1 {
                font-size: 55px;
            }

            .hero p {
                font-size: 20px;
            }

            .hero-buttons {
                justify-content: center;
            }

            .scroll-text {
                display: none;
            }

        }

        /*==========================
Mobile
==========================*/

        @media(max-width:768px) {

            .hero {
                padding-top: 100px;
            }

            .hero-small {
                font-size: 14px;
            }

            .hero h1 {
                font-size: 42px;
            }

            .hero p {
                font-size: 18px;
                line-height: 1.7;
            }

            .hero-buttons .btn {
                width: 100%;
            }

            #about h2 {
                font-size: 32px;
            }

            .whatsapp {
                width: 55px;
                height: 55px;
                font-size: 28px;
                right: 15px;
                bottom: 15px;
            }

        }

        /*==========================
Small Mobile
==========================*/

        @media(max-width:480px) {

            .hero h1 {
                font-size: 34px;
            }

            .hero p {
                font-size: 16px;
            }

            .hero-small {
                letter-spacing: 2px;
                font-size: 13px;
            }

        }

        .banner {
            width: 100%;
            height: 100%;
            background-image: url(656670.jpg);
            background-size: cover;
        }

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: #f8f8f8;
        }

        .products {
            padding: 70px 0;
        }

        /* Product card styling is now loaded globally from css/product-card.css */

        .pagination-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 60px;
        }

        .pagination-box span {
            font-weight: 600;
            color: #666;
        }

        .next-btn {
            border: none;
            background: #d9ff29;
            padding: 14px 50px;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            transition: .3s;
        }

        .next-btn:hover {
            background: #c8ef18;
            transform: translateY(-2px);
        }

        .next-btn i {
            margin-left: 8px;
        }

        /* Large Tablet */
        @media(max-width:992px) {
        }

        /* Tablet */
        @media(max-width:768px) {
            .pagination-box {
                flex-direction: column;
                gap: 20px;
            }

            .next-btn {
                width: 100%;
            }
        }

        /* Mobile */
        @media(max-width:576px) {
            .products {
                padding: 50px 0;
            }

            .next-btn {
                padding: 12px 30px;
            }
        }
    </style>
</head>

    <div class="floating-actions" aria-label="Quick Actions">
